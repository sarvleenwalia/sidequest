name: AntLab engine tests
on:
  push:
    paths: ['antlab/**', '.github/workflows/antlab.yml']
  pull_request:
    paths: ['antlab/**', '.github/workflows/antlab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node antlab/test.cjs
      - run: node --check antlab/engine.js
